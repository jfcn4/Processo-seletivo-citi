<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trilha 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: paciente em coluna única e acolhedora; equipe em painéis finos, separados por linhas. Tema claro único, definido no briefing. */
:root{
  --bg:#FAF8F3;--surface:#FFFFFF;--ink:#1A1A18;--ink-2:#5F5E58;--line:#E7E3DA;--line-2:#CFCABE;
  --blue:#1B5FE0;--blue-soft:#E9F0FE;--green:#1F8A5B;--green-soft:#E6F4EC;--green-ink:#176B46;
  --amber:#8A5200;--amber-soft:#FFF4E0;--amber-line:#EBCF9F;--bar:#D8D3C7;--red:#B3261E;--red-soft:#FCEBE9;--chat:#F1EDE4;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-field:8px;--r-card:14px;--t:180ms ease;
}
*{box-sizing:border-box}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra de demonstração */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.demo-row{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.demo-label{font-size:13px;font-weight:600}
.demo-who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);transition:background var(--t),color var(--t)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.demo-side{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ghost{min-height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background var(--t),border-color var(--t)}
.ghost:hover:not(:disabled){background:var(--bg);border-color:var(--ink)}
.ghost:disabled{color:var(--ink-2)}
.link{min-height:40px;padding:0 8px;font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.hint{border-top:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--ink-2)}
.hint div{max-width:1280px;margin:0 auto;padding-block:6px}
.hint strong{color:var(--ink);font-weight:600}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;transition:background var(--t),transform var(--t)}
.btn:hover:not(:disabled){background:#3A3A36}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--ink-2)}
.btn.small{min-height:40px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.line:hover:not(:disabled){background:var(--bg);border-color:var(--ink)}

/* Paciente */
.patient{max-width:472px;margin:0 auto;padding-block:32px 56px;display:grid;gap:24px}
.chat{background:var(--chat);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.chat-head{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px}
.chat-head strong{display:block;font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.25}
.chat-head span{font-size:14px;color:var(--ink-2)}
.chat-body{padding:20px 16px 24px;display:grid;gap:12px;min-height:420px;align-content:start}
.day{justify-self:center;font-size:13px;color:var(--ink-2)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px;font-size:18px;line-height:1.42;max-width:94%}
.bubble time{display:block;margin-top:4px;font-size:13px;color:var(--ink-2)}
.hello h1{font-family:var(--serif);font-size:40px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
.hello p{margin-top:8px;font-size:18px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.promise{padding:20px}
.promise h2{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.2}
.promise p{margin-top:4px;font-size:18px}
.promise.ok{background:var(--green-soft);border-color:#BFE0CD}
.sec{padding:20px;display:grid;gap:16px}
.sec h2{font-size:18px;font-weight:600;line-height:1.3}
.track{display:grid}
.track li{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:20px;font-size:18px;line-height:32px;color:var(--ink-2)}
.track li:last-child{padding-bottom:0}
.track li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track li.done::before{background:var(--blue)}
.track li.done,.track li.now{color:var(--ink)}
.track li.now{font-weight:600}
.mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);position:relative;z-index:1}
.done .mark{background:var(--blue);border-color:var(--blue);color:#fff}
.now .mark{border-color:var(--blue)}
.now .mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
.track-note{font-size:17px;line-height:1.45;background:var(--blue-soft);border-radius:var(--r-field);padding:12px 14px}
.track-note.ok{background:var(--green-soft)}
.trail-group{display:grid;gap:8px}
.trail-group>span{font-size:15px;color:var(--ink-2)}
.trail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{aspect-ratio:1;max-width:64px;width:100%;justify-self:center;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;border:2px solid transparent}
.node.done{background:var(--blue);color:#fff}
.node.next{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.node.held{background:var(--surface);border:2px dashed var(--line-2);color:var(--ink-2)}
.node.sure{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.gate{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--blue)}
.gate::before,.gate::after{content:"";flex:1;height:1px;background:var(--line-2)}
.gate.ok{color:var(--green-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.why{font-family:var(--serif);font-size:21px;line-height:1.35}
.back{justify-self:start;padding:0;min-height:44px;font-size:15px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.notice{font-size:17px;line-height:1.45;padding:14px 16px;border-radius:var(--r-card);background:var(--amber-soft);border:1px solid var(--amber-line)}
.actions2{display:grid;gap:10px}
.patient.wide{max-width:1040px}
.cols,.col-a,.col-b{display:grid;gap:24px}
.cols{align-items:start}
.now.wait .mark::after{width:14px;height:14px;background:none;border:2px solid var(--line-2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@media (min-width:960px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}.patient.wide{padding-block:40px 64px}.patient.wide .hello h1{font-size:48px}.patient.wide .node{max-width:72px}}
.notice.ok{background:var(--green-soft);border-color:#BFE0CD}

/* Modal de remarcação */
.veil{position:fixed;inset:0;z-index:40;background:rgba(26,26,24,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--surface);border-radius:var(--r-card) var(--r-card) 0 0;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px;animation:rise 200ms ease}
@keyframes rise{from{transform:translateY(16px);opacity:.6}}
.sheet h2{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.2}
.sheet-sub{font-size:17px;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.daycard{display:grid;justify-items:start;gap:0;padding:12px;min-height:104px;border:1px solid var(--line-2);border-radius:var(--r-card);text-align:left;transition:background var(--t),border-color var(--t)}
.daycard span{font-size:14px;color:var(--ink-2)}
.daycard b{font-size:24px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.daycard small{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.daycard small i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.daycard:hover:not(:disabled){border-color:var(--ink)}
.daycard[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
.daycard:disabled{background:var(--bg);border-color:var(--line)}
.times{display:flex;flex-wrap:wrap;gap:8px}
.times button{min-height:48px;min-width:80px;padding:0 16px;border:1px solid var(--line-2);border-radius:var(--r-field);font-size:17px;font-weight:600;transition:background var(--t),border-color var(--t)}
.times button:hover{border-color:var(--ink)}
.times button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}

/* Equipe */
.team{max-width:1280px;margin:0 auto;padding-block:32px 40px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:14px;color:var(--ink-2);margin-bottom:24px}
.brand strong{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.title h1{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1.1;letter-spacing:-.012em}
.title p{margin-top:6px;font-size:18px;color:var(--ink-2)}
.queue-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;margin-top:32px;align-items:start}
.lane+.lane{margin-top:32px}
.lane>h2,.aside h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);padding-bottom:10px}
.urgent{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:var(--r-card);padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.urgent .tag{font-size:13px;font-weight:600;color:var(--amber)}
.urgent h3{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.2;margin-top:2px}
.urgent p{font-size:16px}
.urgent>div{min-width:0;flex:1 1 300px}
.tasks{border-top:1px solid var(--line)}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.task>div{flex:1 1 280px;min-width:0}
.task b{font-weight:600}
.task p{font-size:15px;color:var(--ink-2)}
.empty{font-family:var(--serif);font-size:22px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.aside{display:grid;gap:32px}
.mini{border-top:1px solid var(--line)}
.mini li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.mini b{font-weight:600}
.mini span{display:block;color:var(--ink-2);font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start}
.check svg{flex:none;margin-top:3px;color:var(--green)}
.mini .none{color:var(--ink-2)}
.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}

.panel-veil{position:fixed;inset:0;z-index:40;background:rgba(26,26,24,.28);display:flex;justify-content:flex-end}
.panel{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface);border-left:1px solid var(--line);padding:24px max(24px,env(safe-area-inset-right,0px)) 24px 24px;display:grid;gap:20px;align-content:start;animation:slide 200ms ease}
@keyframes slide{from{transform:translateX(20px);opacity:.6}}
.panel-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.panel h2{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.2}
.panel-sub{font-size:15px;color:var(--ink-2)}
.rule{background:var(--blue-soft);border-radius:var(--r-field);padding:12px 14px;font-size:15px}
.close{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%}
.close:hover{background:var(--bg)}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.person p{font-size:14px;color:var(--ink-2)}
.person .misfit{font-size:13px;color:var(--ink-2)}

/* Painel do Ricardo */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:14px;color:var(--ink-2);padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.hero{margin-top:24px;padding-block:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 40px;align-items:center}
.big{font-family:var(--serif);font-size:clamp(52px,8.4vw,92px);font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.big-label{font-size:20px;margin-top:6px}
.big-sub{font-size:16px;color:var(--ink-2)}
.pill{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--green-ink);background:var(--green-soft);padding:3px 10px;border-radius:999px}
.now-note{margin-top:16px;display:flex;gap:10px;align-items:center;font-size:15px}
.now-note svg{color:var(--green);flex:none}
.charts{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:40px;margin-top:28px}
.chart h2{font-size:18px;font-weight:600;line-height:1.3}
.chart .say{font-family:var(--serif);font-size:24px;line-height:1.25;margin-top:4px}
.chart .src{font-size:13px;color:var(--ink-2);margin-top:4px}
.plot{position:relative;height:250px;margin-top:20px;border-bottom:1px solid var(--line-2)}
.gridline{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gridline span{position:absolute;left:0;top:-18px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(4px,1vw,12px);padding-left:32px;align-items:end}
.col{position:relative;background:var(--bar);border-radius:4px 4px 0 0;display:flex;justify-content:center}
.col em{position:absolute;top:-22px;font-style:normal;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.col.peak{background:var(--blue)}
.col.peak em{color:var(--blue);font-weight:700;font-size:15px;top:-24px}
.xs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(4px,1vw,12px);padding-left:32px;margin-top:6px;font-size:13px;color:var(--ink-2);text-align:center}
.xs b{color:var(--blue)}
.heat{display:grid;gap:4px;margin-top:20px}
.heat li{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 16px;border-radius:var(--r-field);font-size:15px}
.heat b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pop{animation:pop 220ms ease}
@keyframes pop{from{transform:scale(.94);opacity:.5}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;width:min(460px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:var(--r-card);padding:14px 18px;font-size:15px;display:flex;gap:10px;align-items:center;animation:toast 200ms ease}
@keyframes toast{from{transform:translate(-50%,10px);opacity:0}}
.toast svg{flex:none}


/* calendário, agenda, destinatários */
.cal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:24px}
.cal .link{flex-basis:100%;text-align:left;min-height:32px}
.calstrip{display:flex;gap:8px;overflow-x:auto;flex:1 1 0;min-width:0;position:relative;padding:4px 2px;scrollbar-width:none}
.calstrip::-webkit-scrollbar{display:none}
.calday{flex:none;width:68px;min-height:84px;border:1px solid var(--line-2);border-radius:var(--r-field);background:var(--surface);display:grid;gap:2px;justify-items:center;align-content:center;padding:8px 4px;transition:background var(--t),border-color var(--t)}
.calday:hover{border-color:var(--ink)}
.calday span{font-size:13px;color:var(--ink-2)}
.calday b{font-size:20px;font-variant-numeric:tabular-nums}
.calday small{font-size:12px;color:var(--ink-2);min-height:16px;white-space:nowrap}
.calday small.ok{color:var(--green-ink)}
.calday small.todo{color:var(--amber);font-weight:600}
.calday.today{border-color:var(--ink);border-width:2px}
.calday[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.calday[aria-pressed="true"] span,.calday[aria-pressed="true"] b,.calday[aria-pressed="true"] small{color:#fff}
.calnav{width:44px;height:44px;border:1px solid var(--line-2);border-radius:50%;background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.calnav:hover:not(:disabled){border-color:var(--ink)}
.calnav:disabled{opacity:.35}
.h2s{font-size:15px;font-weight:600;color:var(--ink-2);margin:28px 0 8px}
.ag{border-top:1px solid var(--line)}
.ag-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px;padding:8px 0;border-bottom:1px solid var(--line)}
.ag-row.free{background:var(--green-soft);margin-inline:-12px;padding-inline:12px}
.ag-h{font-weight:600;font-variant-numeric:tabular-nums}
.ag-w b{display:block;font-weight:600}
.ag-w small{font-size:14px;color:var(--ink-2)}
.ag-row.free .ag-w b{color:var(--green-ink)}
.badge{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;width:fit-content;background:var(--line)}
.badge.st-veio{background:var(--green-soft);color:var(--green-ink)}
.badge.st-menos{background:var(--amber-soft);color:var(--amber)}
.badge.st-mais{background:var(--blue-soft);color:var(--blue)}
.badge.st-faltou{background:var(--red-soft);color:var(--red)}
.fld{display:block;font-size:15px;font-weight:600;margin-top:4px}
.inp{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-field);font-size:16px;background:var(--surface)}
.inp:focus{outline:2px solid var(--blue);outline-offset:1px}

function bruna(){

  let inner;
  if(!slot){
    inner=`<div class="cols"><div class="col-a">

      <button class="btn block" data-a="bask" data-k="bask" ${s.bPay&&s.bDay&&s.bTime?'':'disabled'}>Pedir minha primeira sessão</button>
    </div></div>`;
  }else{
    let nodes='';for(let n=1;n<=10;n++){const c=n===1&&ok?'next':'held';nodes+=`<div class="node ${c}" role="img" aria-label="Sessão ${n}, ${c==='next'?'próxima':'reservada'}">${n}</div>`}
    const steps=['Pedido feito','Recepção confirma','Primeira sessão'];
    const cur=ok?2:1;
    inner=`<div class="cols"><div class="col-a">
      <section class="card promise ${ok?'ok pop':''}"><h2>${ok?'Tudo certo: sua 1ª sessão está confirmada':'Pedido enviado'}</h2><p>${ok?`${slot[0].toUpperCase()+slot.slice(1)}`:'A recepção confirma e avisa pelo WhatsApp.'}</p></section>
      <section class="card sec" aria-labelledby="t-bt"><h2 id="t-bt">Seu pedido</h2><ol class="track">${steps.map((t,i)=>{const c=i<cur?'done':i===cur?'now':'';return `<li class="${c} ${c==='now'&&!ok?'wait':''}" ${c==='now'?'aria-current="step"':''}><span class="mark">${c==='done'?CHECK:''}</span><span>${t}</span></li>`}).join('')}</ol></section>
    </div><div class="col-b">
      <section class="card sec" aria-labelledby="t-btr"><h2 id="t-btr">Sua trilha de 10 sessões</h2>

    </div></div>`;
  }
  return `<main class="patient wide gutter">${ptools()}
    <div class="hello"><h1>Oi, Bruna</h1><p>${slot?'Seu horário fica guardado do começo ao fim do tratamento.':'Marque sua primeira sessão em Boa Viagem. Leva 1 minuto.'}</p></div>
    ${inner}</main>`;
}

function shell(inner){return `<main class="team gutter"><div class="brand"><strong>Trilha 10</strong><span>Clínica Movimento, Boa Viagem</span></div>${inner}<p class="foot">Dados simulados a partir do desafio.</p></main>`}
function jtabs(){

function queue(){
  const o=s.open,ab=vagasBy('aberta'),of=vagasBy('oferta'),count=o.length+ab.length+of.length;

  ].join('');
  const waiting=[
    !s.released?'<li><b>Dona Célia</b><span>Convênio A, em análise</span></li>':'',
    s.rita==='pedido'?'<li><b>Rita</b><span>Aguardando relatório do Paulo</span></li>':'',
    '<li><b>Seu Antônio</b><span>Convênio B, em análise. O horário dele continua guardado.</span></li>'
  ].join('');

}

function sugg(k){
  const o=s.open,out=[],sentTo=s.sentTo[k]||[],t=TPL.find(x=>x.k===k);
  if(k==='pedido'){
    if(!o.includes('edson'))out.push(['edson','Relatório enviado no portal hoje']);
    if(s.rita==='pronto'&&!o.includes('rita'))out.push(['rita','Relatório enviado no portal hoje']);
  }
  if(k==='porque'){out.push(['celia','Fez a 4ª sessão'],['carla','Fez a 4ª sessão'])}
  if(k==='atraso')out.push(['antonio','Plano sem resposta há 8 dias úteis']);
  if(k==='vespera')Object.keys(s.booked).forEach(key=>{const [n,h]=key.split('|'),b=s.booked[key];
    if(+n===TODAY+1&&!b.pend)out.push([`b-${n}-${h}`,`Marcado para amanhã, às ${h}`,b.name])});
  return out.filter(x=>!sentTo.includes(x[0])&&(!t.conv||!pget(x[0])||pget(x[0]).pay!=='part'));
}
function mensagens(){
  const sent=s.msgs.map(m=>`<li><b>${m.to}</b><span>${m.t} · ${m.h}</span></li>`).join('');
  const rep=s.replies.length?s.replies.map(m=>`<li class="check">${CHECK}<div><b>${m.to}</b><span>${m.t}</span></div></li>`).join(''):'<li class="none">Nenhuma resposta ainda.</li>';
  const cards=TPL.map((m,i)=>{
    const su=sugg(m.k),sentTo=s.sentTo[m.k]||[];
    const sel=s.sel[m.k]||su.map(x=>x[0]);
    const others=s.pats.filter(p=>!su.find(y=>y[0]===p.id)&&!sentTo.includes(p.id)&&(!m.conv||p.pay!=='part'));
    const n=sel.length,c=s.cnt[m.k];
    return `<li class="tpl"><div class="tpl-top"><span class="tpl-n">${i+1}</span><div><h3>${m.n}</h3><p><b>Quando:</b> ${m.q}</p><p><b>Para quem:</b> ${m.to}</p></div><span class="tpl-st">Hoje: ${c?c+(c===1?' enviada':' enviadas'):'nenhuma'}</span></div>
      <div class="bubble tpl-b">${m.txt}${m.k==='vespera'?'<div class="qr static"><span>Vou comparecer</span><span>Preciso remarcar</span></div>':''}</div>
      <div class="rcp"><div class="rcp-h"><b>Para quem enviar</b><span>${su.length?'Sugestão a partir da agenda e das renovações':'Ninguém está nessa situação agora'}</span>${m.conv?'<span class="conv-note">Só convênio: particulares não aparecem</span>':''}</div>
        ${su.length?`<ul class="rcp-list">${su.map(([id,why,l])=>`<li><button class="chk" role="checkbox" aria-checked="${sel.includes(id)}" data-a="rcp" data-v="${m.k}:${id}" data-k="rcp-${m.k}-${id}"><span class="box">${CHECK}</span><span><b>${l||pname(id)}</b><small>${why}</small></span></button></li>`).join('')}</ul>`:''}
        ${s.more[m.k]?`<div class="chips-o" role="group" aria-label="Outras pessoas">${others.map(p=>`<button class="chk" role="checkbox" aria-checked="${sel.includes(p.id)}" data-a="rcp" data-v="${m.k}:${p.id}" data-k="rcp-${m.k}-${p.id}"><span class="box">${CHECK}</span><span><b>${p.name}</b></span></button>`).join('')||'<span class="muted">Não há mais ninguém para esta mensagem.</span>'}</div>`:''}
        <div class="rcp-send"><button class="btn small" data-a="send" data-v="${m.k}" data-k="send-${m.k}" ${n?'':'disabled'}>${n?`Enviar para ${n} ${n===1?'pessoa':'pessoas'}`:'Escolha para quem enviar'}</button>
        <button class="link" data-a="more" data-v="${m.k}" data-k="more-${m.k}">${s.more[m.k]?'Esconder outras pessoas':'Escolher outras pessoas'}</button></div></div></li>`}).join('');
  return shell(`${jhead('Mensagens','As 4 mensagens da trilha, quando cada uma sai e para quem.')}
    <p class="rule">Semanas 2 a 7: a Joana confere para quem vai cada texto e envia com um toque. A partir da semana 8, o envio passa a ser automático, e as sugestões viram regras.</p>

    <aside class="aside"><section><h2>RESPOSTAS DE HOJE</h2><ul class="mini">${rep}</ul></section><section><h2>ENVIADAS HOJE</h2><ul class="mini">${sent}</ul></section></aside></div>`);
}

      <p>Os controles são suposições nossas. As bases vêm dos dados do desafio: 150 faltas por mês em Boa Viagem, 20,5 delas de excesso do convênio nas sessões 6 a 10, R$ 55 por sessão de convênio e R$ 77 por falta, em média.</p></div>

    </div></div></section>`;
}

/* ---------- Motor ---------- */
function render(){
  let main;
  if(s.role==='paciente')main=s.who==='bruna'?bruna():s.screen==='whatsapp'?whatsapp():rastreio()+sheet();
  else if(s.role==='joana')main=joana()+panel()+bookSheet()+waitSheet()+patSheet();
  else if(s.role==='paulo')main=paulo()+repSheet()+vidSheet();
  else main=ricardo();
  document.body.classList.toggle('aa-on',s.big&&s.role==='paciente');
  app.innerHTML=demoBar()+main+(s.toast?`<div class="toast">${CHECK}<span>${s.toast}</span></div>`:'');
  app.querySelectorAll('.calstrip').forEach(st=>{const e=st.querySelector('[aria-pressed="true"]');if(e)st.scrollLeft=e.offsetLeft-st.clientWidth/2+e.offsetWidth/2});
  const el=focusKey&&app.querySelector(`[data-k="${focusKey}"]`);
  if(el)el.focus({preventScroll:true});
}
function toast(t){s.toast=t;live.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{s.toast=null;render()},3800)}
function tween(from,to,fromC,toC){
  const a=document.getElementById('big'),c=document.getElementById('chairs');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||!a){return}
  const t0=performance.now(),D=220;
  (function f(n){const p=Math.min(1,(n-t0)/D);if(!document.getElementById('big'))return;
    a.textContent=brl(from+(to-from)*p);c.textContent=Math.round(fromC+(toC-fromC)*p);if(p<1)requestAnimationFrame(f)})(t0);
}
const act={
  role:v=>{s.role=v;s.panel=null;s.sheet=false;s.rep=false;s.book=null;s.vid=null;s.form=null;s.wform=null;scrollTo(0,0)},
  who:v=>{s.who=v;s.sheet=false},
  big:()=>{s.big=!s.big},
  fcopy:()=>{s.fCopy=!s.fCopy},
  simulate:()=>{s.busy=true;render();setTimeout(()=>{s.busy=false;s.released=true;
    s.done.unshift({t:'<b>Dona Célia</b><span>Renovação liberada, 6ª sessão confirmada</span>'});log('Dona Célia','Plano liberou as sessões 6 a 10');
    toast('Convênio respondeu: renovação da Dona Célia liberada.');focusKey=null;render()},750);return true},
  reset:()=>{clearTimeout(toastTimer);s=fresh();focusKey=null;live.textContent=''},
  open:()=>{s.screen='rastreio';focusKey=null;scrollTo(0,0)},
  whats:()=>{s.screen='whatsapp';focusKey=null;scrollTo(0,0)},
  vou:()=>{s.vespera='vou';s.replies.unshift({to:'Dona Célia',t:'Vou comparecer à 5ª sessão, terça às 10h'});focusKey='open';toast('Resposta registrada no painel da Joana.')},
  vremarcar:()=>{s.vespera='remarcar';s.replies.unshift({to:'Dona Célia',t:'Preciso remarcar a 5ª sessão'});s.screen='rastreio';s.sheet='remarcar';s.day=null;s.time=null;focusKey='closeSheet';scrollTo(0,0)},
  sheet:()=>{s.sheet='remarcar';s.day=null;s.time=null;s.toast=null;focusKey='closeSheet'},
  extra:()=>{s.sheet='extra';s.day=null;s.time=null;s.toast=null;focusKey='closeSheet'},
  closeSheet:()=>{focusKey=s.sheet==='extra'?'extra':'sheet';s.sheet=false},
  day:v=>{s.day=v;s.time=null},
  time:v=>{s.time=v},
  ask:()=>{const d=DAYS.find(x=>x.id===s.day),w=`${d.name}, às ${s.time}`,key=`${d.n}|${s.time}`;
    if(s.sheet==='extra'){s.extra=w;s.extraBy=s.who;s.extraKey=key;s.booked[key]={name:'Dona Célia',tag:'sessão a mais, pedido pelo site',pend:true};s.open.push('extra');focusKey='extra'}
    else{
      if(s.askedKey&&s.booked[s.askedKey]&&s.booked[s.askedKey].pend)delete s.booked[s.askedKey];
      s.asked=w;s.askedBy=s.who;s.askedKey=key;s.booked[key]={name:'Dona Célia',tag:'remarcação, pedido pelo site',pend:true};
      if(!s.open.includes('celia'))s.open.push('celia');
      if(!s.vagas['10|10h'])s.vagas['10|10h']={n:10,h:'10h',origem:'Dona Célia remarcou a 5ª sessão',quem:'celia',st:'aberta',to:null,skip:[]};
      focusKey='sheet'}
    s.sheet=false;toast('Pedido enviado para a recepção.')},
  bpay:v=>{s.bPay=v},
  bday:v=>{s.bDay=v;s.bTime=null},
  btime:v=>{s.bTime=v},
  bask:()=>{const d=DAYS.find(x=>x.id===s.bDay);s.bAsked=`${d.name}, às ${s.bTime}`;s.bKey=`${d.n}|${s.bTime}`;
    s.booked[s.bKey]={name:'Bruna',tag:'primeira sessão, pedido pelo site',pend:true};s.open.push('bruna');
    const b=pget('bruna');if(b)b.pay=s.bPay;focusKey=null;scrollTo(0,0);toast('Pedido enviado para a recepção.')},
  jtab:v=>{s.jtab=v;scrollTo(0,0)},
  rd:v=>{s.rd=+v},
  rdnav:v=>{const i=CAL.findIndex(x=>x.n===s.rd)+(+v);if(CAL[i])s.rd=CAL[i].n},
  ad:v=>{s.ad=+v},
  adnav:v=>{const i=CAL.findIndex(x=>x.n===s.ad)+(+v);if(CAL[i])s.ad=CAL[i].n},
  toag:v=>{s.ad=+v;s.jtab='agenda';focusKey=null;scrollTo(0,0)},
  book:v=>{const [n,h]=v.split(':');s.book={n:+n,h,who:null,ch:'WhatsApp',name:'',pay:null};s.ad=+n;focusKey='bkclose'},
  bkclose:()=>{s.book=null;focusKey=null},
  bw:v=>{s.book.who=v},
  bch:v=>{s.book.ch=v},
  bkpay:v=>{s.book.pay=v},
  bookok:()=>{const b=s.book;let name;
    if(b.who==='novo'){name=b.name.trim();s.pats.push({id:'p'+s.pats.length+'x',name,tel:'—',pay:b.pay,sess:0,fisio:'—',hor:`${dayLabel(b.n)}, ${b.h}`,resp:''})}else name=pname(b.who);
    s.booked[`${b.n}|${b.h}`]={name,tag:TAGCH[b.ch],pend:false};log(name,'Confirmação da marcação');
    s.done.unshift({t:`<b>${esc(name)}</b><span>Marcado ${dayLabel(b.n).toLowerCase()}, às ${b.h}</span>`});s.book=null;focusKey=null;toast(`${name} recebeu a confirmação pelo WhatsApp.`)},
  panel:v=>{s.panel=v;focusKey='closePanel'},
  closePanel:()=>{s.panel=null;focusKey=null},
  offer:v=>{const k=s.panel,vg=s.vagas[k],e=s.wait.find(x=>x.id===v),n=pname(v);
    vg.st='oferta';vg.to=v;e.st='oferta';s.done.unshift({t:`<b>${dayLabel(vg.n)}, às ${vg.h}</b><span>Oferta enviada para ${n}</span>`});
    log(n,`Oferta de vaga: ${dayLabel(vg.n).toLowerCase()}, às ${vg.h}`);s.panel=null;focusKey=null;toast(`Oferta enviada para ${n} pelo WhatsApp.`)},
  vaceita:k=>{const vg=s.vagas[k],e=s.wait.find(x=>x.id===vg.to),n=pname(vg.to);
    vg.st='preenchida';e.st='encaixado';s.booked[k]={name:n,tag:'encaixe pela lista de espera'};
    s.done.unshift({t:`<b>${n}</b><span>Encaixado ${dayLabel(vg.n).toLowerCase()}, às ${vg.h}</span>`});log(n,'Confirmação do encaixe');focusKey=null;toast(`${n} aceitou. Vaga preenchida.`)},
  vrecusa:k=>{const vg=s.vagas[k],e=s.wait.find(x=>x.id===vg.to),n=pname(vg.to);
    vg.skip.push(vg.to);e.st='esperando';vg.st='aberta';vg.to=null;focusKey=null;toast(`${n} recusou. A vaga voltou a ficar aberta.`)},
  vlivre:k=>{s.freed[k]=true;delete s.vagas[k];s.panel=null;focusKey=null;toast('A vaga ficou livre na agenda.')},
  wadd:()=>{s.wform={id:null,hours:[],sat:false};focusKey='wclose'},
  wclose:()=>{s.wform=null;focusKey='wadd'},
  wwho:v=>{s.wform.id=v},
  whour:v=>{const h=s.wform.hours,i=h.indexOf(v);if(i>=0)h.splice(i,1);else h.push(v);h.sort((a,b)=>HRS.indexOf(a)-HRS.indexOf(b))},
  wsat:()=>{s.wform.sat=!s.wform.sat},
  wsave:()=>{const f=s.wform;s.wait.push({id:f.id,hours:f.hours,sat:f.sat,since:'hoje',note:'',st:'esperando'});s.wform=null;focusKey=null;toast(`${pname(f.id)} entrou na lista de espera.`)},
  wdel:v=>{s.wait=s.wait.filter(e=>e.id!==v);focusKey=null;toast(`${pname(v)} saiu da lista de espera.`)},
  pf:v=>{s.pf=v},
  pnew:()=>{s.form={id:null,name:'',tel:'',pay:null,hor:'',resp:''};focusKey='fclose'},
  pedit:v=>{const p=pget(v);s.form={id:p.id,name:p.name,tel:p.tel,pay:p.pay,hor:p.hor,resp:p.resp};focusKey='fclose'},
  fclose:()=>{s.form=null;focusKey=null},
  fpay:v=>{s.form.pay=v},
  fsave:()=>{const f=s.form;
    if(f.id){Object.assign(pget(f.id),{name:f.name.trim(),tel:f.tel.trim(),pay:f.pay,hor:f.hor.trim()||'A definir',resp:f.resp.trim()});toast('Cadastro atualizado.')}
    else{s.pats.push({id:'n'+s.pats.length,name:f.name.trim(),tel:f.tel.trim(),pay:f.pay,sess:0,fisio:'—',hor:f.hor.trim()||'A definir',resp:f.resp.trim()});toast('Paciente cadastrado.')}
    s.form=null;focusKey=null},
  st:v=>{const [id,k]=v.split(':');s.reg[id]=k;if(k==='veio')delete s.reuse[id];s.regSaved=false},
  reuse:v=>{const [id,k]=v.split(':');s.reuse[id]=k;s.regSaved=false},
  savereg:()=>{s.regSaved=true;s.done.unshift({t:`<b>Registro do dia</b><span>Salvo, ${reusedCount()} ${reusedCount()===1?'vaga reaproveitada':'vagas reaproveitadas'}</span>`});focusKey=null;toast('Registro salvo na planilha.')},
  finish:v=>{s.open=s.open.filter(x=>x!==v);
    const m={rita:['Rita','Relatório enviado no portal'],edson:['Seu Edson','Enviado no portal'],celia:['Dona Célia','5ª sessão remarcada'],extra:['Dona Célia','Sessão a mais confirmada'],bruna:['Bruna','1ª sessão confirmada, 10 horários guardados']}[v];
    if(v==='extra'){s.extraDone=true;if(s.booked[s.extraKey])s.booked[s.extraKey].pend=false;log('Dona Célia','Confirmação da sessão a mais');toast('Dona Célia recebeu a confirmação pelo WhatsApp.')}
    if(v==='celia'){s.moved=s.asked;if(s.booked[s.askedKey])s.booked[s.askedKey].pend=false;log('Dona Célia','Confirmação do novo horário');toast('Dona Célia recebeu a confirmação pelo WhatsApp.')}
    if(v==='bruna'){s.bOk=true;if(s.booked[s.bKey])s.booked[s.bKey].pend=false;const b=pget('bruna');if(b)b.hor=s.bAsked;log('Bruna','Confirmação da 1ª sessão');toast('Bruna recebeu a confirmação pelo WhatsApp.')}
    s.done.unshift({t:`<b>${m[0]}</b><span>${m[1]}</span>`});focusKey=null},
  askrep:()=>{s.open=s.open.filter(x=>x!=='rita');s.rita='pedido';s.done.unshift({t:'<b>Rita</b><span>Relatório pedido ao Paulo</span>'});log('Paulo','Pedido de relatório da Rita');focusKey=null;toast('Pedido enviado ao Paulo pelo WhatsApp.')},
  rep:()=>{s.rep=true;focusKey='closeRep'},
  closeRep:()=>{s.rep=false;focusKey='rep'},
  repmodel:()=>{s.repEv='Paciente com dor lombar há 3 meses. Após 2 sessões, relata dor menor ao acordar e já consegue se abaixar sem apoio. A dor ainda aparece no fim do dia, depois de muito tempo sentada.';
    s.repPlan='Seguir com fortalecimento de abdômen e glúteos e aumentar a carga aos poucos. Peço a renovação para consolidar o ganho e diminuir a chance de a dor voltar.';focusKey='sendrep'},
  repn:v=>{s.repN=+v},
  sendrep:()=>{s.rep=false;s.rita='pronto';s.open.push('rita');focusKey=null;toast('Relatório enviado para a Joana.')},
  vid:v=>{s.vid={pid:v,v:null,note:''};focusKey='vclose'},
  vclose:()=>{const p=s.vid&&s.vid.pid;s.vid=null;focusKey=p?'vid-'+p:null},
  vpick:v=>{s.vid.v=v},
  vsend:()=>{const p=pget(s.vid.pid),v=VIDEOS.find(x=>x.id===s.vid.v),note=s.vid.note.trim();
    s.vsent.unshift({to:p.name,t:v.t});log(p.name,`Vídeo: ${v.t}`);
    if(p.id==='celia')s.chat.push({k:'video',t:v.t,d:v.d,note});
    s.vid=null;focusKey=null;toast(`Vídeo enviado para ${p.name} pelo WhatsApp.`)},
  rcp:v=>{const [k,id]=v.split(':'),su=sugg(k).map(x=>x[0]),cur=[...(s.sel[k]||su)];const i=cur.indexOf(id);if(i>=0)cur.splice(i,1);else cur.push(id);s.sel[k]=cur},
  more:v=>{s.more[v]=!s.more[v]},
  send:v=>{const k=v,su=sugg(k),ids=s.sel[k]||su.map(x=>x[0]);if(!ids.length)return;
    const names=ids.map(id=>{const f=su.find(x=>x[0]===id);return f&&f[2]?f[2]:pname(id)});
    s.cnt[k]+=ids.length;s.sentTo[k]=[...(s.sentTo[k]||[]),...ids];s.sel[k]=[];
    const tp=TPL.find(x=>x.k===k);
    if(ids.includes('celia'))s.chat.push({k:'txt',txt:tp.txt});
    s.msgs.unshift({h:'agora',to:names.join(', '),t:tp.n});focusKey=null;toast(`Mensagem enviada para ${names.join(', ')} pelo WhatsApp.`)},
  mode:v=>{if(v===s.mode)return true;const a=s.total,b=s.chairs,c=calc();s.mode=v;
    s.total=v==='trilha'?BASE.total-c.g:BASE.total;s.chairs=v==='trilha'?BASE.chairs-Math.round(c.f):BASE.chairs;render();tween(a,s.total,b,s.chairs);return true}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.self&&e.target!==b)return;
  if(b.disabled)return;
  focusKey=b.dataset.k||null;
  const stop=act[b.dataset.a](b.dataset.v);
  if(!stop)render();
});
/* Campos de texto e controles deslizantes atualizam o estado sem redesenhar a página, para não perder o foco */
document.addEventListener('input',e=>{
  const d=e.target.dataset||{},val=e.target.value;
  const tog=(k,ok)=>{const b=document.querySelector(`[data-k="${k}"]`);if(b)b.disabled=!ok};
  if(d.bkname&&s.book){s.book.name=val;tog('bookok',bookReady());return}
  if(d.rep){if(d.rep==='ev')s.repEv=val;else s.repPlan=val;tog('sendrep',repOk());return}
  if(d.vnote&&s.vid){s.vid.note=val;return}
  if(d.f&&s.form){s.form[d.f]=val;tog('fsave',formOk());return}
  if(d.q){s.q=val;const q=val.trim().toLowerCase();document.querySelectorAll('[data-row]').forEach(r=>{r.hidden=!!q&&!r.dataset.name.includes(q)});return}
  const k=d.sim;if(!k)return;
  s.sim[k]=+val;
  const c=calc();s.total=BASE.total-c.g;s.chairs=BASE.chairs-Math.round(c.f);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  set('o-'+k,fmt(s.sim[k])+(k==='ori'?' pontos':'%'));set('so-f',fmt1(c.f));set('so-g',brl(c.g));set('so-m',fmt1(c.months)+' meses');
  set('big',brl(s.total));set('chairs',s.chairs);set('pill-v',brl(c.g));
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const order=[['vid','vclose'],['form','fclose'],['wform','wclose'],['book','bkclose'],['rep','closeRep'],['sheet','closeSheet'],['panel','closePanel']];
  const hit=order.find(([k])=>s[k]);if(hit){act[hit[1]]();render()}
});
render();
</script>
