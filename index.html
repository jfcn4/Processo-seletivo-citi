<style>
/* Layout: canvas 3D em tela cheia; HUD fixo nas bordas; painel lateral (desktop) / folha inferior (celular). Visual único, escuro. */
:root {
  --space: #07140f;
  --ink: #e9f5ee;
  --ink-dim: #93ab9d;
  --ink-faint: #5d7266;
  --citi: #4fe577;

  --line: rgba(146, 230, 170, .16);
  --f-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;

}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

  background: var(--space); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

:focus-visible { outline: 2px solid var(--citi); outline-offset: 3px; border-radius: 6px; }

/* ---------- HUD ---------- */
.hud-top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
.brand img { height: 26px; width: auto; display: block; }
.brand-text { border-left: 1px solid var(--line); padding-left: 14px; line-height: 1.25; }

.brand-text span { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }

  font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;

}

}

  position: fixed; z-index: 4; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font-family: var(--f-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .04em; text-align: right; line-height: 1.5;
  max-width: 220px;
}
body.is-focused .hud-bottom, body.is-focused .credit { opacity: 0; pointer-events: none; }
body.is-focused .hud-bottom .nav { pointer-events: none; }

/* ---------- Labels ---------- */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.label {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transform: translate(-50%, 0); white-space: nowrap; transition: opacity .3s;

/* ---------- Painel ---------- */
#panel {
  position: fixed; z-index: 8; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 28px;

.p-eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent, var(--citi)); display: flex; align-items: center; gap: 10px; }

.p-handle {

}

.p-tag { color: var(--ink-dim); font-size: 16px; margin: 0 0 20px; max-width: 34ch; }
.p-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); }
.chip.is-status { color: var(--accent, var(--citi)); border-color: currentColor; }
.p-sec { padding: 20px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }

.file-ico { width: 40px; height: 48px; border-radius: 6px; border: 1px solid var(--accent, var(--citi)); display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px; color: var(--accent, var(--citi)); flex: none; }
.file-meta { min-width: 0; }
.file-meta strong { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-meta span { font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); }
.video {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(79,229,119,.28), transparent 60%),
    radial-gradient(80% 80% at 90% 100%, rgba(30,120,70,.35), transparent 60%),
    #06140d;
  display: grid; place-items: center;
}
.video video { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; }
.chip.is-pending { color: var(--ink-faint); border-style: dashed; }
.nav button.is-pending .dot { opacity: .35; box-shadow: none; }
.nav button.is-pending span:last-child::after { content: " · em breve"; font-weight: 500; color: var(--ink-faint); }
.card .c-status { justify-self: start; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--accent, var(--citi)); }
.card.is-pending { opacity: .7; }
.card.is-pending .c-status { color: var(--ink-faint); border-style: dashed; }
.pending-note { display: grid; gap: 6px; padding: 16px; border-radius: 12px; border: 1px dashed var(--line); color: var(--ink-dim); }
.pending-note strong { color: var(--ink); font-size: 15px; }

.video .v-cap { position: absolute; left: 14px; bottom: 12px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; color: var(--ink-dim); text-transform: uppercase; }

/* ---------- Modo lista ---------- */
#list {
  position: fixed; inset: 0; z-index: 9; overflow-y: auto;
  background: rgba(3, 8, 7, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: calc(84px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.list-inner { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.list-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

.card {
  text-align: left; display: grid; gap: 8px; padding: 20px; border-radius: 16px;

.intro-handle {
  margin: 16px 0 38px; padding: 4px 10px; border-radius: 8px; font-family: var(--f-mono); font-size: 13px; font-weight: 500; letter-spacing: .04em;
  color: var(--citi); background: var(--citi-soft); border: 1px solid rgba(79,229,119,.3); animation-delay: .75s !important;
}
.start {
  display: inline-flex; align-items: center; gap: 12px; padding: 15px 26px 15px 28px; border-radius: 999px;
  background: var(--citi); color: #04160c; font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .02em;
  animation: rise 1s .95s cubic-bezier(.2,.8,.2,1) forwards, beacon 2.6s 2s ease-out infinite !important;

  position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;

}

.hud-top { transition: opacity 1s ease .2s; }

<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="labels" aria-hidden="false"></div>

vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){

  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);

  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);

  vec4 y = y_ * ns.x + ns.yyyy;

  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;

  vec3 p1 = vec3(a0.zw, h.y);

  vec3 p3 = vec3(a1.zw, h.w);

    var T = state.warpT, TOTAL = 3.4;
    var env = T < 0.9 ? (T / 0.9) * (T / 0.9) : (T < 2.1 ? 1 : Math.max(0, 1 - (T - 2.1) / 0.5));
    var se = env * env * (3 - 2 * env);
    updateWarp(se * 950, Math.min(1, se * 1.4), dt);
    camera.fov = 45 + 20 * se; camera.updateProjectionMatrix(); updatePixAng();
    var kk = Math.min(1, T / TOTAL), ee = kk < 0.5 ? 4 * kk * kk * kk : 1 - Math.pow(-2 * kk + 2, 3) / 2;
    camera.position.lerpVectors(warpStart, overviewPos(), ee);
    lookTmp.lerpVectors(WARP_LOOK, ORIGIN, ee); camera.lookAt(lookTmp);
    if (!state.flashed && T > 2.15) { state.flashed = true; flash(); Sound.arrive(); document.body.classList.add('is-live'); }
    if (T >= TOTAL) endWarp();
  } else if (state.mode === 'focus') {
    focusGoal(state.focus, goalPos, goalTarget);
    if (state.fly) {
      var F = state.fly; F.t += dt;
      var fk = Math.min(1, F.t / F.dur), fe = fk < 0.5 ? 4 * fk * fk * fk : 1 - Math.pow(-2 * fk + 2, 3) / 2;
      var gp = cyl(goalPos), gt = cyl(goalTarget), aC = nearAngle(gp.a, F.aCam), aT = nearAngle(gt.a, F.aTgt);
      fromCyl(F.p.a + (aC - F.p.a) * fe, F.p.r + (gp.r - F.p.r) * fe, F.p.y + (gp.y - F.p.y) * fe + Math.sin(Math.PI * fk) * F.lift, camera.position);
      fromCyl(F.g.a + (aT - F.g.a) * fe, F.g.r + (gt.r - F.g.r) * fe, F.g.y + (gt.y - F.g.y) * fe, camTarget);
      camera.lookAt(camTarget);
      if (fk >= 1) state.fly = null;
    } else {
      camera.position.lerp(goalPos, damp(2.4, dt));
      camTarget.lerp(goalTarget, damp(3.2, dt));
      camera.lookAt(camTarget);
    }
  } else if (state.mode === 'returning') {
    camera.position.lerp(state.saved.pos, damp(2.2, dt));
    camTarget.lerp(state.saved.target, damp(2.8, dt));
    camera.lookAt(camTarget);
    if (camera.position.distanceTo(state.saved.pos) < 0.6) { camera.position.copy(state.saved.pos); controls.target.copy(state.saved.target); state.mode = 'free'; controls.enabled = true; }
  } else {
    controls.update();
  }

  // rótulos
  var W = window.innerWidth, H = window.innerHeight;
  BODIES.forEach(function (b) {
    planetWorld(b.key, proj);
    var off = b.sun ? SUN_R * 1.25 : b.R * 1.35;
    proj.y -= off;
    proj.project(camera);
    var vis = proj.z < 1 && Math.abs(proj.x) < 1.1 && Math.abs(proj.y) < 1.1 && state.mode !== 'intro' && state.mode !== 'warp';
    b.label.classList.toggle('is-hidden', !vis);
    if (vis) b.label.style.transform = 'translate(' + ((proj.x * 0.5 + 0.5) * W) + 'px,' + ((-proj.y * 0.5 + 0.5) * H + 6) + 'px) translate(-50%,0)';
  });

  composer.render();
  requestAnimationFrame(tick);
}

window.addEventListener('resize', function () {
  var w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  updatePixAng(); renderer.setSize(w, h); if (composerMSAA) composer.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio()); else composer.setSize(w, h); starMat.uniforms.uPR.value = comet.mat.uniforms.uPR.value = renderer.getPixelRatio(); bloom.setSize(w / 2, h / 2);
});
requestAnimationFrame(tick);
})();
</script>
</body>
